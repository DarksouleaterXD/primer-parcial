schema: spec-driven

context: |
  Proyecto: Primer Parcial.
  CU activo: CU-3 — Gestionar proyectos UML persistentes.
  Cambio OpenSpec activo: cu-3-persistencia-proyectos.
  Rama esperada: feature/cu-3-persistencia-proyectos.
  Estado: bloques 1-4 implementados; bloque 5 en cierre técnico.
  Arquitectura: monorepositorio npm workspaces; ProjectDocument canónico en @primer-parcial/uml-domain; persistencia privada mediante NestJS, TypeORM y PostgreSQL JSONB; web solo mediante API.

  Fuentes de verdad:
  - openspec/changes/cu-3-persistencia-proyectos/proposal.md
  - openspec/changes/cu-3-persistencia-proyectos/specs/uml-project-persistence/spec.md
  - openspec/changes/cu-3-persistencia-proyectos/design.md
  - openspec/changes/cu-3-persistencia-proyectos/tasks.md
  - docs/puds/use-cases/CU-3-proyectos-persistentes.md
  - docs/architecture/README.md
  - docs/STATUS.md
  - AGENTS.md

  No anticipar CU-4. No ampliar CU-3 con autosave, realtime, colaboración, roles/share, historial persistido, XMI, generación o IA.

rules:
  proposal:
    - "Definir explícitamente alcance y fuera de alcance."
    - "No ampliar el cambio con mejoras opcionales o preventivas."
  specs:
    - "Cada requisito debe describir comportamiento observable verificable."
    - "No introducir requisitos de otros casos de uso."
  design:
    - "Cada dependencia debe estar justificada por requisitos."
    - "Mantener el ProjectDocument canónico como única semántica UML."
  tasks:
    - "Cada tarea debe corresponder a requisitos aprobados."
    - "No marcar evidencia que no haya sido ejecutada."

operations:
  apply:
    guidance:
      - "Implementar exclusivamente tareas pendientes."
      - "No ejecutar git add, commit o push."
      - "Si aparece una necesidad pública nueva, detenerse antes de inventarla."
  archive:
    guidance:
      - "Archivar solamente después de verify y resolver hallazgos críticos."
